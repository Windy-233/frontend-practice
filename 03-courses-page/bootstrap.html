<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap学习</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">   <!-- class="声明这是导航栏  宽度≥中等时展开，否则堆叠  背景颜色用灰色  底部外边距设为4级" -->
            <div class="container">
                <a class="navbar-brand" href="#">前端课程墙</a>   <!-- navbar-brand决定标题的样式 -->
                <div class="navbar-nav">   <!-- navbar-nav包裹nav-link，并且可管理其方向(横/纵)或其他规则 -->
                    <a class="nav-link active" href="#">全部课程</a>  <!-- active添加高亮 -->
                    <a class="nav-link" href="#">关于</a>   <!-- nav-link指导航项，在其中用active等定义这项的状态 -->
                </div>
            </div>
        </nav>
        <div class="row g-3">   <!-- row定义行，g-n指间距，n越大间距越大 -->
            <div class="col-md-6 col-lg-4">   <!-- col-xx-n，xx为md指中，lg指大，页面≥xx时列宽度占比为n/12 -->
                <div class="card">
                    <div class="card-body">   <!-- 用于card中的body -->
                        <h5 class="card-title">HTML入门</h5>   <!-- 此处及以下都是字面意思。类似navbar-xx，都是bootstrap中默认的部分，不能更改 -->
                        <p class="card-text">结构与语义，页面一切的起点</p>
                        <a href="#" class="btn btn-primary">查看详情</a>   <!-- class="这是个按钮 按钮的颜色是primary" -->
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">CSS布局</h5>
                        <p class="card-text">Flex、Grid与响应式设计</p>
                        <a href="#" class="btn btn-primary">查看详情</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">JavaScript基础</h5>
                        <p class="card-text">让页面动起来的第一门语言</p>
                        <a href="#" class="btn btn-primary">查看详情</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
