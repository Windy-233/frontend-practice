<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录Log in</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>欢迎来到此网页</h1>
        <p>请填写用户名、邮箱和密码</p>
    </header>
    <nav>
        <a href="#intro">填写说明</a><br>
        <a href="#form">开始填写</a>
    </nav>
    <main>
        <section id="intro">
            <h2>填写说明</h2>
            <p>本次填写的内容仅用于课后任务</p>
        </section>
        <section id="form">
            <h2>登录/注册</h2>
            <form action="https://windy-233.github.io/frontend-practice/self-practice/8.31/8-31.html" method="get">
                <fieldset>
                    <legend>个人信息</legend>
                    <p>
                        <label for="name">用户名或昵称：</label>
                        <input type="text" id="name" name="name" placeholder="在此输入" required>
                    </p>
                    <p>
                        <label for="mail">邮箱地址：</label>
                        <input type="email" id="mail" name="mail" placeholder="在此输入" required>
                    </p>
                    <p>
                        <label for="age">年龄：</label>
                        <select id="age" name="age">
                            <option value="">请选择</option>
                            <option value="1">3~12岁</option>
                            <option value="2">13~17岁</option>
                            <option value="3">18岁及以上</option>
                        </select>
                    </p>
                    <p>
                        <label for="password1">密码：</label>
                        <input type="password" id="password1" name="password1" placeholder="在此输入" minlength="6" maxlength="20" required>
                    </p>
                    <p>
                        <label for="password2">确认密码：</label>
                        <input type="password" id="password2" name="password2" placeholder="请再次输入密码" minlength="6" maxlength="20" required>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>网页评价</legend>
                    <p>对这个网页的评价(单选)</p>
                    <label><input type="radio" name="score" value="很好">很好</label>
                    <label><input type="radio" name="score" value="好">好</label>
                    <label><input type="radio" name="score" value="中">中</label>
                    <label><input type="radio" name="score" value="差">差</label>
                    <label><input type="radio" name="score" value="很差">很差</label>
                    <p>希望以后可以加入的功能(多选)</p>
                    <label><input type="checkbox" name="topic" value="保存账号密码">保存账号密码</label>
                    <label><input type="checkbox" name="topic" value="把登录和注册分开">把登录和注册分开</label>
                    <label><input type="checkbox" name="topic" value="快捷登录">快捷登录</label>
                    <label><input type="checkbox" name="topic" value="免密登录">免密登录</label>
                    <label><input type="checkbox" name="topic" value="保存个人信息">保存个人信息</label>
                    <p>
                        <label for="advice">你的建议<br></label>
                        <textarea id="advice" name="advice" cols="40" rows="8" maxlength="1000" placeholder="说些什么吧"></textarea>
                    </p>
                    <p>
                </fieldset>
                    <button type="submit">提交</button>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>软件开发综合实践·自主实践任务</p>
        <small><a href="https://windy-233.github.io/frontend-practice/xinsujuezhan/xinsujuezhan.html" target="_blank">???</a></small>
    </footer>
</body>
</html>
