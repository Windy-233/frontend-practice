<!DOCTYPE HTML>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维场景演示</title>
    <script src="libs/aframe.min-1.4.2.js"></script>
</head>

<body>
    <a href="index.html"
        style="position:fixed; top:12px; left:12px; z-index:999; color:#fff; background:rgba(0,0,0,0.5); padding:6px 12px; border-radius:4px; text-decoration:none;">返回首页</a>
    <a-scene>
        <a-sky color="#aee3f7"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#4caf50"></a-plane>
        <a-box position="-7 2 0" width="1" height="4" depth="1" color="#8b5a2b"></a-box>
        <a-box position="-7 5 0" width="5" height="2" depth="5" color="#2e7d32"></a-box>
        <a-box position="-7 6.6 0" width="3" height="1.4" depth="3" color="#43a047"></a-box>
        <a-box position="6 1.5 0" width="7" height="3" depth="7" color="#c9a06a"></a-box>
        <a-box position="6 3.3 0" width="8" height="0.6" depth="8" color="#7a5230"></a-box>
        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="point" position="0 8 10" color="#fff8e1" intensity="0.6"></a-light>
        <a-camera position="0 4 18"></a-camera>
    </a-scene>
</body>

</html>
