<body>
    <h1>我熟悉的游戏</h1>
    <p>Minecraft</p>
    <img src="images/mc.png" alt="游戏宣传图片" width="300">
    <h2>游戏内容</h2>
    <p>游戏以玩家在一个充满着方块的三维空间中自由地创造和破坏不同种类的方块为主题。</p>
    <p>玩家在游戏中可以在单人或多人模式中通过摧毁或创造精妙绝伦的建筑物和艺术，或者收集物品探索地图以完成游戏的成就（进度）。</p>
    <p>玩家也可以尝试在创造模式下（打开作弊）红石电路和指令等玩法。</p>
</body>
