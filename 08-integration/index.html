<!DOCTYPE HTML>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软件开发综合实践</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="#homepage">校园信息中心</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link active" href="#homepage">首页</a>
                        <a class="nav-link" href="#studyroom">自习室</a>
                        <a class="nav-link" href="#stats">统计</a>
                        <a class="nav-link" href="three-d/scene.html">校园三维</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="container">
        <section id="homepage" class="mb-4">
            <h1></h1>
            <div class="row g-3" id="summary-cards"></div>
        </section>
        <section id="studyroom" class="mb-4">
            <h2 class="h5">自习室查询</h2>
            <div class="row g-2 mb-3">
                <div class="col-auto">
                    <label for="floor-filter" class="form-label">楼层</label>
                    <select id="floor-filter" class="form-select">
                        <option value="all">全部</option>
                        <option value="1">1层</option>
                        <option value="2">2层</option>
                        <option value="3">3层</option>
                        <option value="4">4层</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label for="status-filter" class="form-label">状态</label>
                    <select id="status-filter" class="form-select">
                        <option value="all">全部</option>
                        <option value="开放">开放</option>
                        <option value="闭馆">闭馆</option>
                        <option value="维修">维修</option>
                    </select>
                </div>
            </div>
            <div class="row g-3" id="room-list"></div>
        </section>
        <section id="stats" class="mb-4">
            <h2 class="h5">统计</h2>
            <p id="status" class="alert alert-warning" style="display:none"></p>
            <div id="usage-chart" style="height:360px"></div>
        </section>
    </main>
    <footer class="container py-4 text-center text-muted">
        <p>软件开发综合实践</p>
    </footer>
    <script src="../bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="libs/echarts.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
